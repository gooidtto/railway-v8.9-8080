name: dev-regression

on:
  push:
    branches:
      - "dev/v8.9-next"
      - "dev/v8.9-mlkem-consistency"
      - "dev/v8.9-platform-hardening"
  pull_request:
    branches:
      - "dev/v8.9-next"
      - "dev/v8.9-mlkem-consistency"
      - "dev/v8.9-platform-hardening"
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run gateway regression tests
        run: python -m pytest -q tests/test_health_proxy.py
      - name: Run subscription material consistency tests
        run: python -m pytest -q tests/test_generate_consistency.py
      - name: Run platform capability tests
        run: python -m pytest -q tests/test_platform_capabilities.py
      - name: Emit capability report
        run: python scripts/platform_capabilities.py
