name: dev-regression

on:
  push:
    branches: ["dev/v8.9-next"]
  pull_request:
    branches: ["dev/v8.9-next", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run gateway regression tests
        run: python -m pytest -q tests/test_health_proxy.py
